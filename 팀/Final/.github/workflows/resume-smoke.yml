name: Resume fit smoke test (production)

# 누가: 저장소에 쓰기 권한이 있는 팀원 / 언제: 배포 뒤, 사용자 테스트 전 (10/19 추가)
# 무엇을: 배포된 사이트의 내 경험 연결(/api/resume-fit)이 실제 모델로 끝까지 도는지 확인합니다.
#         실제로 답한 모델, 걸린 시간, 결과 개수, 근거 검사에서 빠진 항목 수를 smoke-results/<실행번호> 브랜치에 남깁니다.
# 어떻게: Actions 탭 > 이 워크플로 > Run workflow. 보내는 이력서는 지어낸 가상 이력서이고, 사람의 개인정보는 없습니다.
# 키: 필요 없음 (배포된 서버 함수가 Vercel 환경 변수의 키를 씁니다)

on:
  workflow_dispatch:
    inputs:
      company:
        description: '분석 완료 기업 id (예: samsung, skhynix)'
        required: true
        default: 'samsung'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: https://ai-promise-six.vercel.app
      COMPANY: ${{ github.event.inputs.company || 'samsung' }}
    steps:
      - uses: actions/checkout@v4

      - name: Call production resume-fit (fictional resume)
        run: |
          mkdir -p data/runs
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          site, company = os.environ["SITE"], os.environ["COMPANY"]
          # 지어낸 가상 이력서 (실제 사람 정보 없음)
          resume = "\n".join([
              "가상 지원자 A의 이력서입니다. 기술경영 석사과정에서 기업 공시 문서를 LLM으로 분석하는 연구를 하고 있습니다.",
              "반도체 기업 전략팀 인턴으로 HBM과 AI 서버용 메모리 시장 자료를 정리하고 경쟁사 투자 계획을 비교했습니다.",
              "Python으로 공시 데이터 수집 파이프라인을 만들고 대시보드로 팀에 공유했습니다.",
              "온디바이스 AI 제품 사례를 조사해 신사업 아이디어 보고서를 썼습니다.",
          ])
          out = {"site": site, "company": company}
          def call(method, path, body=None, timeout=120):
              req = urllib.request.Request(site + path, method=method,
                                           data=json.dumps(body).encode("utf-8") if body else None,
                                           headers={"Content-Type": "application/json", "User-Agent": "ai-promise-smoke/1.0"})
              t0 = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read().decode("utf-8") or "{}"), round(time.time() - t0, 1)
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode("utf-8") or "{}"), round(time.time() - t0, 1)
          s, j, t = call("GET", "/api/resume-fit?check=1&t=%d" % time.time())
          out["health"] = {"status": s, "seconds": t, "body": j}
          s, j, t = call("POST", "/api/resume-fit", {"company": company, "resume": resume}, timeout=300)
          out["post"] = {"status": s, "seconds": t, "model": j.get("model"), "ok": j.get("ok"),
                         "counts": {k: len(j.get(k) or []) for k in ("connections", "gaps", "talking_points", "questions")},
                         "dropped": j.get("dropped"), "error": j.get("error")}
          out["post_body"] = j
          with open("data/runs/resume-smoke.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=1)
          print(json.dumps({k: v for k, v in out.items() if k != "post_body"}, ensure_ascii=False, indent=1))
          PY

      - name: Push result to smoke-results branch
        if: always()
        run: |
          B="smoke-results/${GITHUB_RUN_ID}"
          git config user.name "Sungtae10"
          git config user.email "kkst01221203@gmail.com"
          git checkout -b "$B"
          if [ -e data/runs/resume-smoke.json ]; then git add -f data/runs/resume-smoke.json; fi
          if git diff --cached --quiet; then echo "올릴 결과가 없습니다"; exit 0; fi
          git commit -q -m "이력서 기능 실배포 점검 결과 (GitHub Actions run $GITHUB_RUN_ID)"
          git push -q origin "$B"
          echo "결과 브랜치: $B"
