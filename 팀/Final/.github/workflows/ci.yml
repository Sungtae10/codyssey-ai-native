name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install engine dependencies
        run: python -m pip install --upgrade pip && pip install -r engine/requirements.txt

      - name: Compile Python
        run: python -m compileall -q engine eval tests

      - name: Run offline mock end-to-end test
        run: python tests/test_mock.py

      - name: Validate sample JSON
        run: python -m json.tool tests/sample_data.json > /dev/null

      - name: Check evaluation CLI
        run: python eval/evaluate.py --help > /dev/null

      - name: Check frontend JavaScript syntax
        run: node --check app/js/app.js
