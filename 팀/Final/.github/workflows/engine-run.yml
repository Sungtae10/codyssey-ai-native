name: Engine run (OpenDART auto collect + AI Promise engine)

# 누가: 저장소에 쓰기 권한이 있는 팀원 / 언제: 기업을 새로 분석할 때 (10/19 추가)
# 무엇을: 기업마다 OpenDART에서 보고서 3개(2024·2025 사업보고서, 2026 반기보고서)를 자동으로 받고,
#         엔진 1~7단계(수집, 약속 추출·분류, 근거 검색, 판정, 인용 검사, 면접 카드)를 돌려
#         결과를 engine-results/<실행번호>-<기업> 브랜치에 올립니다. main과 화면 데이터는 바꾸지 않습니다.
# 어떻게: Actions 탭 > 이 워크플로 > Run workflow (기업 목록), 또는 engine-run/ 로 시작하는 브랜치에 push.
# 키: 저장소 Settings > Secrets and variables > Actions의 OPENDART_API_KEY, OPENAI_API_KEY.
#     키 값은 기록에 찍지 않습니다 (GitHub가 가리고, 코드도 출력하지 않음).
# 핵심 기업(samsung, skhynix)은 화면에 넣지 않고 사람 정답과 비교(eval)만 합니다.

on:
  workflow_dispatch:
    inputs:
      companies:
        description: 'config.yaml 기업 이름 JSON 목록 (예: ["kakao","naver","shinhanbank","skhynix"])'
        required: true
        default: '["kakao","naver","shinhanbank","skhynix"]'
  push:
    branches: ['engine-run/**']

permissions:
  contents: write

jobs:
  analyze:
    name: analyze (${{ matrix.company }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        company: ${{ fromJson(github.event.inputs.companies || '["kakao","naver","shinhanbank","skhynix"]') }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      COMPANY: ${{ matrix.company }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install engine dependencies
        run: python -m pip install --upgrade pip && pip install -r engine/requirements.txt

      - name: Check keys are set (values are never printed)
        run: |
          ok=1
          if [ -n "$OPENAI_API_KEY" ]; then echo "OPENAI_API_KEY: 있음"; else echo "OPENAI_API_KEY: 없음"; ok=0; fi
          if [ -n "$OPENDART_API_KEY" ]; then echo "OPENDART_API_KEY: 있음"; else echo "OPENDART_API_KEY: 없음"; ok=0; fi
          k="$(printf %s "$OPENDART_API_KEY" | tr -d '[:space:]')"
          if [ -n "$k" ] && [ "${#k}" -ne 40 ]; then echo "(주의) OPENDART_API_KEY 길이가 40자가 아닙니다. 복사할 때 빠진 글자가 없는지 확인하세요."; fi
          case "$OPENAI_API_KEY" in sk-*) ;; "") ;; *) echo "(주의) OPENAI_API_KEY가 sk-로 시작하지 않습니다.";; esac
          [ "$ok" = 1 ]

      - name: Fetch from OpenDART, run engine (steps 0 to 7), export
        run: |
          set -o pipefail
          mkdir -p data/runs
          cd engine
          python analyze_companies.py "$COMPANY" 2>&1 | tee "../data/runs/$COMPANY.log"

      - name: Push results to engine-results branch
        if: always()
        run: |
          B="engine-results/${GITHUB_RUN_ID}-${COMPANY}"
          git config user.name "Sungtae10"
          git config user.email "kkst01221203@gmail.com"
          git checkout -b "$B"
          echo "올릴 파일 크기:"
          du -sh data/work/"$COMPANY"/* data/results/* data/dart/manifest.json 2>/dev/null || true
          # 있는 것만 하나씩 올립니다 (핵심 기업은 data/results가 없어서, 한꺼번에 add하면 전부 빠짐)
          for p in "data/runs/$COMPANY.log" data/dart/manifest.json data/results "data/work/$COMPANY" eval/results; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          git status --short | head -40
          if git diff --cached --quiet; then echo "올릴 결과가 없습니다"; exit 0; fi
          git commit -q -m "엔진 자동 실행 결과: $COMPANY (GitHub Actions run $GITHUB_RUN_ID)"
          git push -q origin "$B"
          echo "결과 브랜치: $B"
