<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Promise | 기업 AI 약속 검증</title>
  <meta name="description" content="회사가 사업보고서에 쓴 AI 약속과 다음 해 실행 근거를 나란히 보여주는 서비스">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 첫 화면이 깜빡이지 않도록, 저장된 테마를 가장 먼저 적용해요.
    try {
      var saved = localStorage.getItem('ai-promise-theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app" id="app" aria-live="polite"></div>

  <!-- 예시 데이터: 실제 결과 파일(data/results.json)이 없을 때만 쓰여요 -->
  <script src="data/sample-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
