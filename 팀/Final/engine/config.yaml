# AI Promise 엔진 설정. 경로는 engine 폴더 기준입니다.

# 10/19 모델 올림 (김성태 결정). 공식 가격표 기준 100만 토큰당 입력/출력:
#   gpt-6-luna $0.10/$0.50, gpt-6.1-sol $2/$10, gpt-6-astra $10/$50
# 효과는 엔진을 돌린 뒤 같은 사람 정답과 비교해서만 말합니다 (README 9장).
llm:
  extract_model: gpt-6-luna         # 2~3단계 약속 추출·분류 (구조화 작업이라 가벼운 모델)
  judge_model: gpt-6.1-sol          # 5단계 판정 (약속과 근거의 차이를 보는 핵심 단계)
  card_model: gpt-6.1-sol           # 7단계 면접 카드
  escalation_model: gpt-6-astra     # 아래 판정이 나오면 이 모델로 한 번 더 판정합니다. 비워 두면 하지 않습니다
  escalate_verdicts: [partial]      # 일부 확인(근거 확인과의 경계가 애매한 판정)만 다시 봅니다
  fallback_model: gpt-4o-mini       # 위 모델을 쓸 수 없으면(계정 권한, 매개변수 오류) 이 모델로 바꿔 계속하고 기록에 남깁니다
  embed_model: text-embedding-3-large   # 바꾸면 벡터 DB를 모델 이름별로 새로 만듭니다
  temperature: null                 # null이면 보내지 않습니다 (추론 모델은 temperature를 받지 않을 수 있음). gpt-4o-mini만 쓸 때는 0

paths:
  pdf_dir: ../data/pdf                          # DART에서 받은 PDF를 여기에 (핵심 2곳 6개 + 시연 3곳 9개)
  dart_dir: ../data/dart                        # fetch_dart.py가 OpenDART에서 자동으로 받은 글(.txt)과 manifest.json. 있으면 PDF 대신 씁니다
  work_dir: ../data/work                        # 단계별 중간 결과 (저장소에 올려도 됨, chroma_db는 제외)
  results_file: ../data/results/ai_promise_data.json   # 화면에 넣을 결과 파일
  labels_file: labels.json                      # 화면 문구 (sample_data.json의 labels와 같음)
  eval_dir: ../eval                             # 정답 매길 목록, 평가 결과

sections: [I5, II, IV]   # 읽는 장: I5=정관에 관한 사항, II=사업의 내용, IV=이사의 경영진단 및 분석의견
keywords: [AI, 인공지능, 머신러닝, 딥러닝, "생성형 AI", 생성형AI]   # v2 확정: 자동화·지능형 단독어는 제외

retrieval:
  use_vector: true      # 의미 검색(ChromaDB) 함께 쓰기
  top_windows: 8        # 검색 결과 상위 몇 곳을 볼지
  max_candidates: 24    # 판정 때 AI에게 보여 줄 후보 문장 수
  max_attempts: 3       # 근거를 못 찾으면 검색어를 바꿔 다시 찾는 횟수 (처음 포함)

# 핵심 기업 2곳. url: DART에서 그 보고서를 열었을 때 주소창의 주소를 그대로 붙여 넣으세요. 화면의 "원문 링크"가 됩니다.
#   fetch_dart.py로 자동으로 받으면 url이 비어 있는 칸은 DART 원문 주소(접수번호)로 자동으로 채워집니다.
# stock_code: OpenDART 자동 수집에서 법인을 종목코드로 정확히 찾습니다 (app/data/listed-companies.json의 KRX 목록과 같음).
# corp_code: OpenDART 고유번호(8자리). 적으면 기업 목록을 받지 않고 바로 씁니다.
